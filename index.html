</style></head><body><header class="top"><div class="shell"><button class="logo" onclick="go('home')">Tourist<b>+</b></button><nav class="topnav"><button onclick="go('home')">Explore</button><button onclick="go('my')">My Tours</button><button onclick="go('favorites')">Favorites</button><button onclick="go('profile')">Profile</button></nav></div></header><main id="app"></main><footer class="footer"><div class="shell"><div><strong>Tourist+</strong> by Social Life & Co.<br><span class="small">Explore your city, your way.</span></div><div><button onclick="go('help')">Help</button> · <button onclick="go('admin')">Content studio</button><p class="small">Stay in public areas, follow traffic laws, and check venue hours. Never use navigation while driving.</p></div></div></footer><nav class="bottom" aria-label="Main navigation"><button data-nav="home" onclick="go('home')"><span>⌕</span>Explore</button><button data-nav="my" onclick="go('my')"><span>▤</span>My Tours</button><button data-nav="favorites" onclick="go('favorites')"><span>♡</span>Favorites</button><button data-nav="profile" onclick="go('profile')"><span>◯</span>Profile</button></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const cityImage='https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1400&q=85';
const baseTours=[{id:'dark',title:'Fort Worth After Dark',subtitle:'Ghosts, Legends & Haunted History',category:'Ghost & Haunted',price:9.99,duration:'75–90 min',distance:'1.3 mi',mode:'Walking',labels:['18+','Night Recommended'],narrator:'Ghost Host',description:'Follow the streets of downtown after sunset for an atmospheric look at the stories people still tell. The historical narration in this prototype is demo content awaiting research and verification.',stops:[{title:'Sundance Square',address:'Sundance Square, Fort Worth, TX',lat:32.7543,lng:-97.3311,story:'Look across the square as evening settles in. Imagine how different these streets felt to the people who passed through them decades ago.\n\nDemo story: This stop is a preview of the atmosphere and navigation experience. Verified local history and sourced stories will replace this text before tours are sold.',fact:'Demo fact: A researched local detail will appear here.'},{title:'Main Street',address:'Main Street, Fort Worth, TX',lat:32.7515,lng:-97.3302,story:'Before you keep walking, look up at the changing skyline.\n\nDemo story: This chapter will feature a researched Fort Worth legend and a source-backed account. The final route and access conditions must be checked on location.',fact:'Demo fact pending research.'},{title:'Courthouse View',address:'Tarrant County Courthouse, Fort Worth, TX',lat:32.7578,lng:-97.3322,story:'Pause where you can safely view the architecture from a public sidewalk.\n\nDemo story: A verified account and narration will be added here. Do not enter closed spaces or trespass.',fact:'Demo fact pending research.'}]},{id:'uncovered',title:'Fort Worth Uncovered',subtitle:'Icons, History & Hidden Stories',category:'Historic Landmarks',price:9.99,duration:'90–110 min',distance:'1.6 mi',mode:'Walking',labels:['Family-Friendly','Accessible route to verify'],narrator:'Dr. History',description:'Meet the city through its streets, public spaces, and the details most visitors walk right past. Historical narration is demo content pending verification.',stops:[{title:'Sundance Square',address:'Sundance Square, Fort Worth, TX',lat:32.7543,lng:-97.3311,story:'Start in the heart of downtown. Take a moment to notice the buildings around you and the way the space brings people together.\n\nDemo story: Research and fact checking are still needed before this becomes a paid historical tour.',fact:'Demo fact pending research.'},{title:'Tarrant County Courthouse',address:'Tarrant County Courthouse, Fort Worth, TX',lat:32.7578,lng:-97.3322,story:'Look up at the courthouse from a safe public viewing point.\n\nDemo story: This will become a sourced history of the building and surrounding district.',fact:'Demo fact pending research.'},{title:'Water Gardens',address:'Fort Worth Water Gardens, Fort Worth, TX',lat:32.7481,lng:-97.3265,story:'Pause and take in this public space from a safe viewpoint.\n\nDemo story: A researched architectural story belongs here. Follow posted safety rules near water features.',fact:'Demo fact pending research.'}]}];
const categories=['Ghost & Haunted','Historic Landmarks','First Timer / City Highlights','Date Night','Family Fun','Foodie Crawl','Girls Day','Free / Budget-Friendly','Nightlife','Hidden Gems','Arts & Culture'];const planned=['Dallas','Houston','Austin','San Antonio','New Orleans','Miami','Atlanta','Chicago','Las Vegas'];const key='tourist-plus-prototype-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}};state.progress??={};state.favorites??=[];state.demoUnlocks??=[];state.reviews??=[];state.content??={};const save=()=>localStorage.setItem(key,JSON.stringify(state));let page='home',currentTour='dark',selected=0,mapMode='map',geo=null,mapInstance=null,filter='All',stars=0;const $=id=>document.getElementById(id);const tour=id=>baseTours.find(t=>t.id===id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const progress=t=>state.progress[t.id]||{done:[],last:0};const unlocked=t=>state.demoUnlocks.includes(t.id);function toast(s){let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),3300)}function track(event,meta={}){let source=new URLSearchParams(location.search).get('utm_source')||new URLSearchParams(location.search).get('source')||document.referrer&&new URL(document.referrer).hostname||'direct';state.source??=source;state.events??=[];state.events.push({event,source:state.source,at:Date.now(),...meta});state.events=state.events.slice(-100);save()}function go(p,id){if(mapInstance){mapInstance.remove();mapInstance=null}page=p;if(id)currentTour=id;window.scrollTo(0,0);history.pushState({},'',location.pathname+location.search+(p==='home'?'':'#'+p+(id?'/'+id:'')));render();if(p==='detail')track('tour_view',{tour:id});if(p==='city')track('city_view',{city:'Fort Worth'})}function nav(){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===page))}function img(){return cityImage}function card(t){let fav=state.favorites.includes(t.id);return `<article class="card"><div class="cardimage"><img src="${img()}" alt="Evening city skyline, illustrative placeholder"></div><div class="cardbody"><div class="eyebrow">${safe(t.category)}</div><h3>${safe(t.title)}</h3><p>${safe(t.subtitle)}</p><div><span class="pill">${t.duration}</span><span class="pill">${t.stops.length} stops</span><span class="pill">${t.mode}</span>${t.labels.map(x=>`<span class="pill">${safe(x)}</span>`).join('')}</div><div class="cardfooter"><span class="price">$${t.price.toFixed(2)}</span><div><button class="btn outline" aria-label="${fav?'Remove':'Add'} ${safe(t.title)} ${fav?'from':'to'} favorites" onclick="favorite('${t.id}')">${fav?'♥':'♡'}</button> <button class="btn" onclick="go('detail','${t.id}')">Explore tour</button></div></div></div></article>`}function favorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render();toast(state.favorites.includes(id)?'Saved to favorites':'Removed from favorites')}
function home(){return `<section class="hero"><div class="shell"><div class="eyebrow" style="color:#9acaff">Self-guided city experiences</div><h1>Tourist<span style="color:#57acff">+</span></h1><p>Explore your city, your way. Great stories, flexible routes, and the freedom to go whenever you want.</p><form class="search" onsubmit="event.preventDefault();searchCity()"><input id="citysearch" aria-label="Where are you exploring?" placeholder="Where are you exploring?" value="Fort Worth"><button class="btn" type="submit">Explore</button></form></div></section><section class="section"><div class="shell"><div class="sectionhead"><div><div class="eyebrow">Choose your city</div><h2>Where to next?</h2></div></div><div class="citygrid"><button class="citycard" onclick="go('city')"><strong>Fort Worth</strong><span>Texas · Explore now →</span></button>${planned.slice(0,7).map(c=>`<div class="citycard muted"><strong>${c}</strong><span>Coming soon</span></div>`).join('')}</div></div></section><section class="section alt"><div class="shell"><div class="eyebrow">Featured experiences</div><h2>Start with Fort Worth</h2><div class="grid">${baseTours.map(card).join('')}</div><div class="panel" style="margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap"><div><strong>Fort Worth duo · $16.99</strong><p style="margin:3px 0">Both tours, one city. Save $3 compared with buying separately.</p></div><button class="btn secondary" onclick="go('bundle')">View bundle</button></div></div></section><section class="section"><div class="shell"><div class="eyebrow">Explore by mood</div><h2>What kind of day is it?</h2><div class="moods">${categories.map(c=>`<button onclick="filter='${c.replaceAll("'","\\'")}';go('city')">${safe(c)}</button>`).join('')}</div></div></section><section class="section alt"><div class="shell"><h2>How Tourist+ works</h2><div class="grid"><div class="panel"><h3>1. Pick your experience</h3><p>Browse tours and enjoy the entire first stop free.</p></div><div class="panel"><h3>2. Explore at your pace</h3><p>Use the map, listen or read, and visit stops in any order.</p></div><div class="panel"><h3>3. Pick up where you left off</h3><p>Your progress saves on this device in the prototype.</p></div></div></div></section>`}function searchCity(){let v=$('citysearch').value.trim();if(/fort worth/i.test(v))go('city');else toast(v+' is coming soon. Fort Worth is ready to explore.')}
function city(){let list=filter==='All'?baseTours:baseTours.filter(t=>t.category===filter);return `<section class="featurehero"><div class="shell"><div class="eyebrow" style="color:#98cdff">Texas · Now exploring</div><h1>Fort Worth</h1><p>Big character, open skies, and downtown stories worth slowing down for.</p><button class="btn" onclick="go('detail','dark')">See featured tour</button></div></section><section class="section"><div class="shell"><div class="eyebrow">Find your adventure</div><h2>Fort Worth tours</h2><div class="moods" style="margin-bottom:25px"><button class="${filter==='All'?'selected':''}" onclick="filter='All';render()">All tours</button>${categories.map(c=>`<button class="${filter===c?'selected':''}" onclick="setFilter(this.dataset.value)" data-value="${safe(c)}">${safe(c)}</button>`).join('')}</div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<div class="empty">No tour in this category yet. More Fort Worth experiences are coming.</div>'}<div class="panel" style="margin-top:22px"><div class="eyebrow">Bundle & save</div><h3>Two sides of Fort Worth · $16.99</h3><p>Go from local legends to the city’s most memorable landmarks. Save $3.</p><button class="btn secondary" onclick="go('bundle')">View bundle</button></div></div></section>`}function setFilter(v){filter=v;render()}
function detail(){let t=tour(currentTour),p=progress(t);return `<div class="shell breadcrumb"><button onclick="go('city')">Fort Worth</button> / ${safe(t.title)}</div><section class="featurehero" style="min-height:370px"><div class="shell"><div class="eyebrow" style="color:#91cbff">${safe(t.category)}</div><h1>${safe(t.title)}</h1><p>${safe(t.subtitle)}</p></div></section><section class="section"><div class="shell detailgrid"><div><div class="eyebrow">Your city, your pace</div><h2>A different way to see Fort Worth</h2><p>${safe(t.description)}</p><div class="stats"><div class="stat"><strong>${t.duration}</strong><span class="small">Duration</span></div><div class="stat"><strong>${t.distance}</strong><span class="small">Distance</span></div><div class="stat"><strong>${t.stops.length}</strong><span class="small">Stops</span></div><div class="stat"><strong>${t.mode}</strong><span class="small">Tour type</span></div></div><div>${t.labels.map(x=>`<span class="pill">${safe(x)}</span>`).join('')}</div><h2 style="margin-top:38px">What you’ll experience</h2><p>A flexible route through downtown with location pins, short stories, and room to explore between stops. Read along or play narration when audio is added.</p><h3>Before you go</h3><p>Bring comfortable shoes and a charged phone. Check the weather and venue hours. Stay on public paths, watch traffic, and use the app only while safely stopped.</p><div class="stoppreview"><div class="eyebrow">Free first stop</div><h3>${safe(t.stops[0].title)}</h3><p>Try the full first stop and see how the map works before deciding.</p><button class="btn secondary" onclick="openPlayer('${t.id}',0)">Preview stop 1</button></div><h3>Stops on this tour</h3><div class="stoplist">${t.stops.map((s,i)=>`<div class="stopitem"><span><strong>${i+1}. ${safe(s.title)}</strong><span class="small">${safe(s.address)}</span></span><span>${i?'🔒':'Free'}</span></div>`).join('')}</div></div><aside class="panel sticky"><div class="eyebrow">Self-guided tour</div><h2>$${t.price.toFixed(2)}</h2><p>One tour · explore on your schedule.</p><button class="btn" style="width:100%" onclick="${unlocked(t)?`openPlayer('${t.id}',${p.last})`:`go('purchase','${t.id}')`}">${unlocked(t)?'Continue demo tour':'Unlock tour'}</button><button class="btn outline" style="width:100%;margin-top:10px" onclick="openPlayer('${t.id}',0)">Try first stop free</button><p class="small">Prototype checkout is disabled. No charge is taken.</p><hr style="border:0;border-top:1px solid #dde8f3;margin:20px 0"><strong>Two-tour bundle · $16.99</strong><p class="small">Save $3 on both Fort Worth experiences.</p><button class="btn secondary" onclick="go('bundle')">See bundle</button></aside></div></section>`}
function openPlayer(id,i=0){currentTour=id;selected=i;mapMode='map';go('player',id);track(i===0?'free_preview_view':'tour_start',{tour:id,stop:i})}function player(){let t=tour(currentTour),p=progress(t),s=t.stops[selected],locked=selected>0&&!unlocked(t),done=p.done.length;return `<div class="playerhead"><div class="shell"><div class="row"><div><button class="btn outline" onclick="go('detail','${t.id}')">← Tour details</button><h2 style="margin:15px 0 3px">${safe(t.title)}</h2><div style="opacity:.8">${done} of ${t.stops.length} stops completed · ${safe(t.narrator)}</div></div><button class="btn secondary" onclick="useLocation()">⌖ Use My Location</button></div><div class="progressbar" style="margin-top:18px"><span style="width:${100*done/t.stops.length}%"></span></div></div></div><div class="shell playerlayout"><div><div class="tabs" role="tablist"><button class="${mapMode==='map'?'active':''}" onclick="switchMode('map')">Map View</button><button class="${mapMode==='list'?'active':''}" onclick="switchMode('list')">Stop / List View</button></div><div id="maparea">${mapMode==='map'?'<div id="tourmap" class="map" aria-label="Interactive map of tour stops"></div>':`<div class="stoplist">${t.stops.map((st,i)=>`<button class="stopitem ${selected===i?'selected':''}" onclick="selectStop(${i})"><span><strong>${p.done.includes(i)?'✓ ':''}${i+1}. ${safe(st.title)}</strong><span class="small">${safe(st.address)}</span></span><span>${i&&!unlocked(t)?'🔒':selected===i?'Selected':'View'}</span></button>`).join('')}</div>`}</div><div class="actions"><button class="btn secondary" onclick="selectStop(0)">Start at Stop 1</button><button class="btn outline" onclick="startNearMe()">Start Near Me</button></div><p class="small">Tap a pin or choose any stop. Location is requested only when you tap a location button. Map tiles require a connection.</p></div><aside class="panel"><div class="eyebrow">Stop ${selected+1} of ${t.stops.length} ${p.done.includes(selected)?'· Completed':''}</div><h2>${safe(s.title)}</h2><p class="small">${safe(s.address)}${geo?` · ${Math.max(0.1,meters(geo.latitude,geo.longitude,s.lat,s.lng)/1609).toFixed(1)} mi from you`:''}</p>${locked?`<div class="notice"><strong>Enjoying the preview?</strong><p>Stop 1 is free. Unlock the tour to continue this demo route.</p><button class="btn" onclick="go('purchase','${t.id}')">View unlock options</button></div>`:`<div><p class="story">${safe(s.story)}</p><div class="notice"><strong>Audio narration</strong><p class="small">The ${safe(t.narrator)} recording has not been uploaded yet. Read the transcript above.</p><audio controls style="width:100%" aria-label="Narration for ${safe(s.title)}" disabled></audio></div><p><strong>Fun fact</strong><br>${safe(s.fact)}</p><a class="btn outline" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${s.lat}%2C${s.lng}">Open directions ↗</a><div class="actions"><button class="btn outline" onclick="selectStop(${Math.max(0,selected-1)})" ${selected===0?'disabled':''}>Previous</button><button class="btn secondary" onclick="selectStop(${Math.min(t.stops.length-1,selected+1)})" ${selected===t.stops.length-1?'disabled':''}>Next</button><button class="btn" onclick="markComplete()">${p.done.includes(selected)?'Completed ✓':'Mark complete'}</button></div></div>`}</aside></div>`}function switchMode(v){mapMode=v;render()}function selectStop(i){selected=i;let p=progress(tour(currentTour));p.last=i;state.progress[currentTour]=p;save();render()}function markComplete(){let t=tour(currentTour);if(selected>0&&!unlocked(t))return go('purchase',t.id);let p=progress(t);if(!p.done.includes(selected))p.done.push(selected);p.last=selected;state.progress[t.id]=p;save();track('stop_complete',{tour:t.id,stop:selected});if(p.done.length===t.stops.length){track('tour_complete',{tour:t.id});go('complete',t.id)}else{toast('Stop complete!');render()}}function mapInit(){if(page!=='player'||mapMode!=='map')return;let t=tour(currentTour);if(!window.L){$('tourmap').innerHTML='<div class="empty">Map could not load. Use Stop / List View or open directions from each stop.</div>';return}mapInstance=L.map('tourmap').setView([32.753,-97.331],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(mapInstance);t.stops.forEach((s,i)=>{let complete=progress(t).done.includes(i),icon=L.divIcon({className:'',html:`<div style="background:${complete?'#209e8b':i===selected?'#ffae42':'#116fd0'};color:white;border:3px solid white;box-shadow:0 2px 12px #0025;border-radius:50%;width:35px;height:35px;display:grid;place-items:center;font-weight:800">${complete?'✓':i+1}</div>`,iconSize:[35,35]});L.marker([s.lat,s.lng],{icon}).addTo(mapInstance).bindTooltip(s.title).on('click',()=>selectStop(i))});if(geo){L.circleMarker([geo.latitude,geo.longitude],{radius:9,color:'#09244b',fillColor:'#52b6ff',fillOpacity:1}).addTo(mapInstance).bindTooltip('You are here');mapInstance.setView([geo.latitude,geo.longitude],15)}}function useLocation(then){if(!navigator.geolocation)return toast('Location is unavailable in this browser.');navigator.geolocation.getCurrentPosition(pos=>{geo=pos.coords;if(typeof then==='function'){then();return}render();let t=tour(currentTour),near=t.stops.findIndex(s=>meters(geo.latitude,geo.longitude,s.lat,s.lng)<100);toast(near>=0?`You’ve arrived near Stop ${near+1}. Stay aware of your surroundings.`:'Location shown on the map.');},()=>toast('Location access was denied or unavailable. You can still use the stop list.'),{enableHighAccuracy:false,timeout:10000,maximumAge:60000})}function meters(a,b,c,d){let R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;return 2*R*Math.asin(Math.sqrt(Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2))}function startNearMe(){if(!geo){useLocation(startNearMe);return}let t=tour(currentTour),ix=t.stops.map((s,i)=>[i,meters(geo.latitude,geo.longitude,s.lat,s.lng)]).sort((a,b)=>a[1]-b[1])[0][0];selectStop(ix);toast(`Nearest stop: ${t.stops[ix].title}`)}function downloadNotice(){toast('Offline media download is not available in this prototype yet.')}
function purchase(){let t=tour(currentTour);return `<section class="section"><div class="shell" style="max-width:720px"><button class="btn outline" onclick="go('detail','${t.id}')">← Back to tour</button><div class="panel" style="margin-top:25px"><div class="eyebrow">Prototype unlock</div><h1 style="font-size:2.7rem">${safe(t.title)}</h1><p>Planned price: <strong>$${t.price.toFixed(2)}</strong>. Secure checkout and account syncing are not connected yet. You will not be charged.</p><div class="notice">Use the demo unlock to try every stop and the completion flow on this device. This is not a purchase or entitlement.</div><button class="btn" style="margin-top:25px" onclick="demoUnlock('${t.id}')">Unlock demo tour</button></div></div></section>`}function demoUnlock(id){if(!state.demoUnlocks.includes(id))state.demoUnlocks.push(id);save();track('demo_unlock',{tour:id});openPlayer(id,0)}function bundle(){return `<section class="section"><div class="shell" style="max-width:850px"><div class="eyebrow">Fort Worth bundle</div><h1>Two sides of the city. One adventure.</h1><p>Fort Worth After Dark and Fort Worth Uncovered together for $16.99. Save $3 compared with buying them separately.</p><div class="grid">${baseTours.map(card).join('')}</div><div class="notice" style="margin-top:22px">Bundle checkout is planned. Preview each tour’s first stop now.</div></div></section>`}function complete(){let t=tour(currentTour),other=baseTours.find(x=>x.id!==t.id);return `<section class="section"><div class="shell" style="max-width:700px;text-align:center"><div class="confetti" aria-hidden="true">✦ ✧ ✦</div><div class="badge" aria-label="Tour completed">🏅</div><div class="eyebrow">Adventure complete</div><h1 style="font-size:3rem">You completed ${safe(t.title)}!</h1><p>Your Fort Worth explorer badge is ready. Thanks for coming along.</p><div class="panel" style="text-align:left"><h2>How was your adventure?</h2><div class="rating" aria-label="Star rating">${[1,2,3,4,5].map(n=>`<button aria-label="${n} stars" class="${stars>=n?'on':''}" onclick="stars=${n};render()">★</button>`).join('')}</div><label class="formfield">A few words about your tour<textarea id="reviewtext" rows="3" placeholder="What stood out?"></textarea></label><button class="btn" onclick="submitReview()">Save feedback</button><p class="small" style="margin-top:12px">Public reviews require moderation and an account connection. Sharing publicly will always be optional.</p></div><div class="panel" style="text-align:left;margin-top:20px"><div class="eyebrow">Keep exploring Fort Worth</div><h3>${safe(other.title)}</h3><p>${safe(other.subtitle)}</p><button class="btn secondary" onclick="go('detail','${other.id}')">Explore the next tour</button></div></div></section>`}function submitReview(){if(!stars)return toast('Choose a star rating first.');state.reviews.push({tour:currentTour,stars,text:$('reviewtext').value.trim(),date:Date.now(),public:false});save();toast('Thanks! Your feedback was saved on this device.');track('review_submit',{tour:currentTour})}
function my(){let started=baseTours.filter(t=>progress(t).done.length||unlocked(t));return `<section class="section"><div class="shell"><div class="eyebrow">Your adventures</div><h1 style="font-size:3rem">My Tours</h1><p class="notice">Prototype progress and favorites are saved in this browser on this device. Clearing browser data removes them.</p><div class="accountgrid">${['Purchased','In Progress','Completed'].map(group=>`<div><h2>${group}</h2>${group==='Purchased'?'<div class="empty">Purchases will appear here when checkout is connected.</div>':(group==='Completed'?started.filter(t=>progress(t).done.length===t.stops.length):started.filter(t=>progress(t).done.length<t.stops.length)).map(t=>`<div class="panel" style="margin-bottom:14px"><h3>${safe(t.title)}</h3><p>${progress(t).done.length}/${t.stops.length} stops completed</p><button class="btn secondary" onclick="${group==='Completed'?`go('complete','${t.id}')`:`openPlayer('${t.id}',${progress(t).last})`}">${group==='Completed'?'View badge':'Continue'}</button></div>`).join('')||'<div class="empty">Nothing here yet. Explore Fort Worth to begin.</div>'}</div>`).join('')}</div></div></section>`}function favorites(){let list=baseTours.filter(t=>state.favorites.includes(t.id));return `<section class="section"><div class="shell"><div class="eyebrow">Saved for later</div><h1 style="font-size:3rem">Favorites</h1>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<div class="empty">No favorites yet. Tap the heart on any tour to save it here.</div>'}</div></section>`}function profile(){return `<section class="section"><div class="shell" style="max-width:740px"><div class="eyebrow">Your account</div><h1 style="font-size:3rem">Profile & Settings</h1><div class="panel"><h2>Browsing as a guest</h2><p>You can browse and try a free stop without signing in. Email, Google, and Apple sign-in will be added with the account backend.</p><div class="notice">Your demo progress is stored locally on this device. It does not sync across devices.</div><button class="btn outline" style="margin-top:20px" onclick="go('help')">Get help</button></div></div></section>`}function help(){return `<section class="section"><div class="shell" style="max-width:800px"><div class="eyebrow">We’re here to help</div><h1 style="font-size:3rem">Help</h1>${[['Tour not loading','Reload the page and check your connection. Your progress on this device should remain saved.'],['Purchase missing','Checkout is not active in the prototype. No real purchases can be made here.'],['Location not working','Enable location in your browser settings and try Use My Location again. You can browse the stop list without it.'],['Audio not playing','Narration files are pending. Every demo stop has readable text.'],['Download and offline help','Offline media download is planned for purchased tours. Map tiles currently require a connection.']].map(([a,b])=>`<div class="panel" style="margin-bottom:12px"><h3>${a}</h3><p>${b}</p></div>`).join('')}<p>Contact support: <a href="mailto:support@example.com">support@example.com</a> <span class="small">(placeholder address)</span></p></div></section>`}function groupon(){track('groupon_landing_view');return `<section class="featurehero"><div class="shell"><div class="eyebrow" style="color:#9acbff">A Fort Worth night out</div><h1>Fort Worth After Dark</h1><p>Ghosts, Legends & Haunted History. Explore at your own pace, right from your phone.</p><button class="btn" onclick="go('detail','dark')">Preview first stop free</button></div></section><section class="section"><div class="shell" style="max-width:850px"><h2>How it works</h2><p>Preview the first stop, follow a flexible downtown route, and read short atmospheric stories. This is a demo tour with unverified story placeholders.</p><div class="notice">Groupon voucher redemption is not active. Do not enter a voucher code here. If you arrived through Groupon, keep your voucher until redemption instructions are available.</div></div></section>`}
function admin(){return `<section class="section"><div class="shell"><div class="eyebrow">Content architecture · prototype</div><h1 style="font-size:3rem">Content studio</h1><div class="warning">This is a local prototype editor, not a secure admin system. Changes remain in this browser and are not published to visitors. A production admin needs authentication, a database, image/audio uploads, and a publishing workflow.</div><div class="grid" style="margin-top:24px"><div class="panel"><h2>Cities</h2><p>Fort Worth · Active</p><p>${planned.join(' · ')} · Planned</p><label class="formfield">New city name<input id="newcity" placeholder="City name"></label><button class="btn secondary" onclick="addContent('cities','newcity')">Add draft locally</button></div><div class="panel"><h2>Tours & stops</h2><p>Two Fort Worth sample tours. Each has ordered stops, coordinates, text, narrator, optional audio, and future perk fields.</p><label class="formfield">New tour title<input id="newtour" placeholder="Tour title"></label><button class="btn secondary" onclick="addContent('tours','newtour')">Add draft locally</button></div></div><div class="panel" style="margin-top:20px"><h2>Local drafts</h2><p>${safe(JSON.stringify(state.content))}</p><h3>Content model</h3><p class="small">cities · categories · tours · tour_stops · users · purchases/entitlements · tour_progress · favorites · reviews · promotions · business_partners · perks · seasonal_availability · audio_tracks</p><p>Seasonal availability uses start and end dates. Active tours can be shown automatically within that window. Partner perks support offer, address, linked stop, expiration, and active status when connected to a backend.</p><button class="btn outline" onclick="exportContent()">Export local data JSON</button></div></div></section>`}function addContent(type,id){let v=$(id).value.trim();if(!v)return;state.content[type]??=[];state.content[type].push({title:v,status:'draft'});save();render()}function exportContent(){let blob=new Blob([JSON.stringify({tours:baseTours,categories,plannedCities:planned,localDrafts:state.content},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tourist-plus-content.json';a.click();URL.revokeObjectURL(a.href)}
function render(){if(mapInstance){mapInstance.remove();mapInstance=null}nav();$('app').innerHTML=({home,city,detail,player,purchase,bundle,complete,my,favorites,profile,help,groupon,admin}[page]||home)();if(page==='player')setTimeout(mapInit,0)}let hash=location.hash.slice(1).split('/');if(hash[0]&&['home','city','detail','player','purchase','bundle','complete','my','favorites','profile','help','groupon','admin'].includes(hash[0])){page=hash[0];if(hash[1]&&tour(hash[1]))currentTour=hash[1]}if(new URLSearchParams(location.search).get('source')==='groupon'&&!location.hash)page='groupon';window.addEventListener('popstate',()=>{let route=location.hash.slice(1).split('/');page=route[0]|| (new URLSearchParams(location.search).get('source')==='groupon'?'groupon':'home');if(route[1]&&tour(route[1]))currentTour=route[1];selected=progress(tour(currentTour)).last||0;render()});render();
</script></body></html>
